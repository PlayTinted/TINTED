# Publishes the privacy policy, terms and account-deletion page (site/) to GitHub Pages.
# Google Play needs public URLs for the privacy policy and for account deletion.
name: Publish legal pages

on:
  push:
    branches: [main]
    paths: ["site/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Fill in company name and support email
        # Repository variables (Settings → Secrets and variables → Actions → Variables): COMPANY_NAME, SUPPORT_EMAIL
        run: |
          sed -i "s|__COMPANY__|${{ vars.COMPANY_NAME }}|g; s|__SUPPORT_EMAIL__|${{ vars.SUPPORT_EMAIL }}|g" site/*.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
