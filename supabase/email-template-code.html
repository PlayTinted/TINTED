<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#160b26;padding:32px 16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <tr><td align="center">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;background:#22123a;border-radius:24px;padding:36px 28px;">
