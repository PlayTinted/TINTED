<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#160b26">
<title>Try a duel · Tinted</title>
<meta name="description" content="Try a Tinted duel right now, no sign-up. Pop hearts to clear their photo.">
<link rel="canonical" href="https://playtinted.com/play">
<meta property="og:title" content="Try a Tinted duel">
<meta property="og:description" content="No sign-up. Pop hearts to clear their photo.">
<meta property="og:image" content="https://playtinted.com/assets/og.jpg">
<link rel="icon" href="/assets/logo.webp">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=Leckerli+One&display=swap">
<link rel="stylesheet" href="/app/src/styles.css">
<style>
  #app{padding-block:16px 40px}
  .g-top{display:flex;align-items:center;justify-content:space-between}
  .g-top .brand{gap:8px;text-decoration:none}
  .g-top .wordmark{font-size:24px}
  .g-who{display:flex;align-items:center;gap:12px;padding:10px;border-radius:20px;background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
  .g-photo{width:58px;height:58px;border-radius:16px;overflow:hidden;flex:none;background:#2a0f4a}
  .g-photo img{width:100%;height:100%;object-fit:cover;transition:filter 1s var(--ease),transform 1s var(--ease)}
  .g-who b{font-size:17px}
  .g-who small{display:block;color:var(--mist);font-size:13.5px}
  .g-clarity{margin-left:auto;font-size:12px;font-weight:600;color:var(--mist);text-align:right}
  .g-clarity i{display:block;width:70px;height:4px;border-radius:4px;background:rgba(255,255,255,.1);margin-top:6px;overflow:hidden}
  .g-clarity i b{display:block;height:100%;width:0;background:#ff6fb5;transition:width .8s var(--ease)}
  .g-facts{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .g-facts li{border-radius:14px;padding:11px 12px;font-size:14px;line-height:1.3;background:rgba(255,255,255,.03);box-shadow:inset 0 0 0 1px rgba(255,255,255,.07);color:var(--mist)}
  .g-facts li .k{display:block;font-size:12px;font-weight:600;margin-bottom:3px}
  .g-facts li .v{filter:blur(5px);opacity:.5;transition:filter .6s,opacity .6s}
  .g-facts li.on{background:rgba(255,79,163,.1);box-shadow:inset 0 0 0 1px rgba(255,140,200,.35);color:var(--ivory);animation:hpop .5s cubic-bezier(.34,1.56,.64,1)}
  .g-facts li.on .k{color:#ffb3d6}
  .g-facts li.on .v{filter:none;opacity:1}
  .overlay h2{margin:0;font-family:"Leckerli One",cursive;font-weight:400;font-size:34px;line-height:1.1;text-shadow:0 .04em 0 #c2187a}
  .pick{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:330px}
  .pick button{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 10px 12px;border:0;border-radius:20px;cursor:pointer;
    background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);color:var(--ivory);font:600 16px var(--display);transition:transform .25s var(--ease),background-color .2s}
  .pick button:hover{background:rgba(255,79,163,.16)}
  .pick button:active{transform:scale(.96)}
  .pick img{width:70px;height:70px;border-radius:18px;object-fit:cover;filter:blur(7px) saturate(.6) brightness(.85)}
  .pick small{font-weight:400;color:var(--mist);font-size:13px}
  .fine{font-size:12.5px;color:var(--mist);max-width:30em;margin:0}
  .end-photo{width:120px;height:120px;border-radius:26px;object-fit:cover;box-shadow:0 14px 30px -12px rgba(0,0,0,.6)}
  .cta{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 26px;border-radius:999px;background:var(--rose,#ff4fa3);color:#2b0a1c;font:600 17px var(--display);text-decoration:none}
  .ghost{background:none;border:0;color:var(--mist);font:600 15px var(--display);text-decoration:underline;cursor:pointer}
</style>
</head>
<body>
<main id="app">
  <div class="g-top">
    <a class="brand" href="/?home"><span class="logo-mini"><img class="logo logo-sm" src="/app/src/brand/logo-256.webp" alt=""></span><span class="wordmark wordmark-sm">Tinted</span></a>
    <button class="sound-btn" id="snd" style="position:static">Sound on</button>
  </div>

  <div class="g-who">
    <span class="g-photo"><img id="photo" src="/assets/mara.webp" alt=""></span>
    <span><b id="who">Your match</b><small id="town">Pick who you'd like to play</small></span>
    <span class="g-clarity" id="clar">Tinted<i><b id="clarBar"></b></i></span>
  </div>

  <div class="scoreboard">
    <div class="side you"><span class="who">You</span><span class="pts" id="you">0</span><span class="tiny muted">Your round</span></div>
    <div class="clock" id="clock">1:00</div>
    <div class="side them"><span class="who" id="themName">Them</span><span class="pts" id="opp">0</span><span class="tiny muted" id="oppState">Waiting</span></div>
  </div>
  <div class="tug" aria-hidden="true"><i id="tug"></i></div>

  <div class="board" id="board">
    <canvas id="cv" aria-label="Glass orbs. Drag to aim, let go to shoot, tap your orb to swap."></canvas>
    <div class="overlay" id="ov">
      <h2>Try a duel</h2>
      <p class="muted" style="margin:0">No sign-up. Who would you like to play?</p>
      <div class="pick">
        <button type="button" data-who="mara"><img src="/assets/mara.webp" alt="">I'd like to play<br>a woman</button>
        <button type="button" data-who="jake"><img src="/assets/jake.webp" alt="">I'd like to play<br>a man</button>
      </div>
      <p class="fine">For this demo you'll play Mara or Jake, our AI stand-ins. On Tinted you play real people.</p>
    </div>
  </div>

  <ul class="g-facts" id="facts"></ul>
</main>
<div id="toast" role="status" hidden></div>

<script type="importmap">{"imports":{"@capacitor/core":"/app/cap-web.js","@capacitor/haptics":"/app/cap-web.js"}}</script>
<script type="module">
import { createBoard } from "/app/src/board.js";
import { sfx, unlockAudio, isMuted, setMuted } from "/app/src/sound.js";
import { createGame } from "/app/shared/engine.js";

const $ = (s) => document.querySelector(s);
const PEOPLE = {
  mara: { name: "Mara", age: 27, town: "Bristol", photo: "/assets/mara.webp", they: "her", facts: [
    ["Job", "Graphic designer, ex-barista"], ["Sunday", "Parkrun, then a very long brunch"], ["Coffee", "Iced latte, even in December"],
    ["Secret skill", "Names any song in three seconds"], ["Last trip", "Copenhagen, solo, no regrets"], ["Looking for", "Someone who'll lose at Mario Kart gracefully"]] },
  jake: { name: "Jake", age: 29, town: "London", photo: "/assets/jake.webp", they: "his", facts: [
    ["Job", "Architect, loves a project"], ["Sunday", "Car boot sale, then a roast"], ["Coffee", "Flat white, oat milk, no shame"],
    ["Secret skill", "Unbeatable at Connect 4"], ["Last trip", "Lisbon, ate too many pastéis"], ["Looking for", "Someone who'll play back"]] },
};
const CLARITY = ["Tinted", "Clearing", "Almost clear", "Clear"];
const BLUR = ["blur(14px) saturate(.6) brightness(.8)", "blur(8px) saturate(.8)", "blur(3.5px) saturate(.95)", "none"];
const ROUND = 60000;
const track = (n) => { try { globalThis.tintedTrack?.(n); } catch (e) {} };

let P = null, game, board, phase = "pick", startAt = 0, hearts = 0, opp = 0, oppTarget = 0, nextOppAt = 0, leading = null, finalCalled = false;

function renderFacts() {
  const f = P ? P.facts : PEOPLE.mara.facts.map(([k]) => [k, "Free a heart to find out"]);
  $("#facts").innerHTML = f.map(([k, v], i) => `<li class="${i < hearts ? "on" : ""}"><span class="k">${k}</span><span class="v">${v}</span></li>`).join("");
}
function renderClarity() {
  const lvl = hearts >= 6 ? 3 : Math.floor(hearts / 2);
  $("#photo").style.filter = BLUR[lvl];
  $("#photo").style.transform = `scale(${1.15 - lvl * 0.05})`;
  $("#clar").firstChild.textContent = CLARITY[lvl];
  $("#clarBar").style.width = `${Math.min(100, hearts / 6 * 100)}%`;
}

function newGame() {
  board?.destroy();
  game = createGame((Math.random() * 2 ** 31) >>> 0);
  hearts = 0; opp = 0; leading = null; finalCalled = false;
  oppTarget = 1900 + Math.floor(Math.random() * 700);
  renderFacts(); renderClarity(); hud();
  board = createBoard($("#cv"), game, {
    canPlay: () => phase === "playing",
    onInput() {},
    onShot: (res) => {
      if (res.heartsFound > 1) board.text(`${res.heartsFound} hearts freed`, { size: 1.1, col: "#ffc2d3" });
      for (let i = 0; i < res.heartsFound; i++) {
        hearts++;
        const f = P.facts[hearts - 1];
        if (f && res.heartsFound === 1) board.text(`Heart freed · ${f[0]}`, { size: 1.05, col: "#ffc2d3" });
        renderFacts(); renderClarity();
        if (hearts % 2 === 0 && hearts <= 6) setTimeout(() => board.text(`${P.they[0].toUpperCase() + P.they.slice(1)} photo is clearing`, { size: 0.8, col: "#bfe6ff" }), 700);
      }
      hud();
      if (game.over) end();
    },
    onFrame: () => {
      if (phase !== "playing") return;
      const now = Date.now();
      if (now >= nextOppAt) {
        const frac = Math.min(1, (now - startAt) / ROUND);
        // A friendly rival: keeps pace with you so the demo stays close.
        const goal = Math.round(Math.min(oppTarget * Math.pow(frac, 1.05), game.score + 120 + 260 * frac));
        if (goal > opp) opp += Math.min(goal - opp, 30 + Math.floor(Math.random() * 160));
        nextOppAt = now + 900 + Math.random() * 1600;
      }
      if (now - startAt >= ROUND && !board.busy) end();
      hud();
    },
  });
}

function hud() {
  const left = phase === "playing" ? Math.max(0, ROUND - (Date.now() - startAt)) : (phase === "done" ? 0 : ROUND);
  const s = Math.ceil(left / 1000);
  $("#clock").textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
  $("#clock").classList.toggle("low", phase === "playing" && s <= 10);
  $("#you").textContent = game.score.toLocaleString("en-GB");
  $("#opp").textContent = opp.toLocaleString("en-GB");
  const total = game.score + opp;
  $("#tug").style.width = (total ? (game.score / total) * 100 : 50) + "%";
  if (phase !== "playing") return;
  const ahead = game.score > opp ? true : game.score < opp ? false : leading;
  if (leading !== null && ahead !== leading) {
    if (ahead) { board.text("You're ahead", { size: 1.2, col: "#ffd27a" }); sfx.heart(); }
    else board.text(`${P.name} took the lead`, { size: 1, col: "#ff9db8" });
  }
  leading = ahead;
  if (!finalCalled && s <= 10) { finalCalled = true; board.text(game.score > opp ? "Hold on. 10 seconds" : `10 seconds. ${opp - game.score + 1} to win`, { size: 0.9, col: "#ffd27a" }); }
}

function choose(key) {
  P = PEOPLE[key];
  $("#photo").src = P.photo; $("#photo").alt = `${P.name}'s photo, tinted`;
  $("#who").textContent = `${P.name}, ${P.age}`; $("#town").textContent = `${P.town} · demo profile`;
  $("#themName").textContent = P.name;
  try { localStorage.setItem("tinted:try-who", key); } catch (e) {}
  track("ClickButton");
  start();
}

function start() {
  unlockAudio();
  newGame();
  phase = "count";
  let n = 3;
  $("#ov").hidden = false;
  $("#ov").innerHTML = `<div class="count" id="count">3</div><p class="muted">Free the hearts to clear ${P.name}'s photo</p><p class="tiny muted">Drag to aim · let go to shoot · tap your orb to swap</p>`;
  sfx.tick();
  const t = setInterval(() => {
    n--;
    if (n > 0) { $("#count").textContent = n; sfx.tick(); return; }
    clearInterval(t);
    $("#oppState").innerHTML = '<span class="live">Playing now</span>';
    $("#ov").hidden = true; phase = "playing"; startAt = Date.now(); nextOppAt = startAt + 1500; sfx.go();
  }, 800);
}

function end() {
  if (phase !== "playing") return;
  phase = "done"; sfx.end();
  $("#oppState").textContent = "Final score";
  opp = Math.max(300, Math.round(game.score * (0.86 + Math.random() * 0.24)));
  hud();
  const you = game.score, m = Math.abs(you - opp), won = you > opp;
  // The demo reveals them in full at the end, so you see what the duel unlocks.
  hearts = Math.max(hearts, 6); renderFacts(); renderClarity();
  $("#ov").hidden = false;
  $("#ov").innerHTML = `
    <img class="end-photo" src="${P.photo}" alt="${P.name}, revealed">
    <h2>${game.over ? "The ceiling caught you" : won ? "You won!" : you === opp ? "Dead heat" : `${P.name} won`}</h2>
    <p class="display num" style="font-size:36px;line-height:1;margin:0">${you.toLocaleString("en-GB")} <span class="muted">–</span> ${opp.toLocaleString("en-GB")}</p>
    <p class="muted" style="margin:0">${won ? (m < 300 ? `By ${m}. Close one.` : `By ${m}.`) : (m < 300 ? `Just ${m} in it. So close.` : `By ${m}.`)} That's ${P.name} revealed.</p>
    <a class="cta" href="/app/">Now play a real person</a>
    <button class="ghost" id="again">Play again</button>
    <p class="fine">Free while we launch · 18+</p>`;
  $("#again").onclick = () => start();
}

$("#ov").addEventListener("click", (e) => { const b = e.target.closest("[data-who]"); if (b) choose(b.dataset.who); });
$("#snd").textContent = isMuted() ? "Sound off" : "Sound on";
$("#snd").onclick = (e) => { unlockAudio(); setMuted(!isMuted()); e.target.textContent = isMuted() ? "Sound off" : "Sound on"; };
newGame();
</script>
</body>
</html>
